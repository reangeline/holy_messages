name: CI - Unit Tests

# Every PR into develop or main, and every push to them, runs the unit suite
# (localization keys, LocalData vs. policy, legal documents, subscription
# gates, orientação rules…). The UI suite (~12 min) runs on the Mac before a
# release instead — see NEXT_STEPS / the workflow notes.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in sorted(d.items(), reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project Missale.xcodeproj -scheme Missale \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:MissaleTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tail -40
