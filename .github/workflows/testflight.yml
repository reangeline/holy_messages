name: TestFlight

# Every merge into develop builds, signs and uploads to TestFlight. develop
# only takes PRs with the unit tests green, so this doesn't test again.
#
# Signing is Xcode's cloud-managed signing, authorised by an App Store Connect
# API key — no certificates or profiles are stored here. Secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents).
# Until they exist the job says so and stops, without failing.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency: testflight

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      # Above every build sent by hand (the last was 6) and always increasing.
      # Expressions can't add, so the shell does it.
      - name: Build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 6 ))" >> "$GITHUB_ENV"
      - name: Key check
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Sem a chave da App Store Connect (ASC_KEY_P8); o envio ao TestFlight foi pulado."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: env.HAS_KEY == 'true'
        with:
          xcode-version: latest-stable
      - name: API key
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Missale.xcodeproj -scheme Missale -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Missale.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -20
      - name: Upload to TestFlight
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>3Q524UT33T</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Missale.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -20
          echo "::notice::Build 2.0 ($BUILD_NUMBER) enviado ao TestFlight."
      - name: Remove key
        if: always() && env.HAS_KEY == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"
