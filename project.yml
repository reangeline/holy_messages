name: Missale
options:
  bundleIdPrefix: com.holymessages
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Fica aqui, e não no Xcode: o .xcodeproj é gerado por `xcodegen generate`,
    # então time e estilo de assinatura ajustados na aba Signing & Capabilities
    # desaparecem na próxima geração — foi o que derrubou o widget.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3Q524UT33T
    # Os .xcstrings aqui são escritos à mão e um teste exige que toda chave
    # exista nos três idiomas. A extração automática despejava no catálogo as
    # strings de interpolação pura ("%@ · %@", "•", "‹ %@"), que não têm o que
    # traduzir — e quebrava esse teste a cada build.
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  Missale:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "WidgetExtension/**"
          # Notas internas de importação, não conteúdo do app.
          - "MockData/Generated/IMPORTACAO.md"
    dependencies:
      - target: MissaleWidgetsExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Missale
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "6"
        # O app não usa criptografia própria (nenhuma rede; a compra é do
        # StoreKit). Declarado aqui, o App Store Connect para de perguntar a
        # cada build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-MediumItalic.ttf
          - EBGaramond-SemiBold.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
    entitlements:
      path: App/Missale.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.holymessages.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app

  # Exists so language switching and the Settings preferences can actually be
  # exercised: the Simulator can't be driven from a shell, and every fix in
  # those screens was going out verified only by reading the code.
  MissaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Missale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app.UITests
        TEST_TARGET_NAME: Missale
        GENERATE_INFOPLIST_FILE: "YES"

  # The liturgical engine is pure date arithmetic, so it belongs in a unit test
  # that can call it directly — a UI test can only read what a screen happens
  # to print for today's date, which is how a wrong Sunday cycle went unnoticed.
  MissaleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: Missale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app.Tests
        GENERATE_INFOPLIST_FILE: "YES"

  MissaleWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WidgetExtension
      - path: Sources/DesignSystem/Colors.swift
      - path: Sources/DesignSystem/Typography.swift
      # Shared with the app so the widget draws today's word from the same
      # catalog instead of a second copy that drifts — see WidgetContent.swift.
      - path: Sources/DesignSystem/AppLanguage.swift
      - path: Sources/Models/LocalizedCatalog.swift
      - path: Sources/Models/WordOfDay.swift
      - path: Sources/MockData/MockWordOfDay.swift
      # O pool importado vive num arquivo gerado; sem ele o widget
      # mostraria um pool menor que o do app.
      - path: Sources/MockData/Generated/GeneratedWordOfDay.swift
      # O santo do widget vinha de uma cópia cravada; agora sai do mesmo
      # catálogo trilíngue do app.
      - path: Sources/Models/Saint.swift
      - path: Sources/MockData/MockSaints.swift
      - path: Sources/MockData/Generated/GeneratedSaints.swift
      - path: Sources/MockData/Generated/GeneratedSaintsSecondBatch.swift
      - path: Sources/MockData/Generated/GeneratedSaintsThirdBatch.swift
      - path: Sources/MockData/Generated/GeneratedSaintsFourthBatch.swift
      - path: Sources/Fonts
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Missale Widgets
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-MediumItalic.ttf
          - EBGaramond-SemiBold.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
    entitlements:
      path: WidgetExtension/MissaleWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.holymessages.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app.Widgets
        PRODUCT_NAME: MissaleWidgets

schemes:
  Missale:
    build:
      targets:
        Missale: all
        MissaleWidgetsExtension: all
        MissaleUITests: [test]
        MissaleTests: [test]
    run:
      config: Debug
      # Produtos locais para rodar e capturar a tela de assinatura sem
      # depender da App Store. Não entra no app — ver Tests/Support/LEIA.md.
      storeKitConfiguration: Tests/Support/Missale.storekit
    test:
      config: Debug
      targets:
        - MissaleTests
        - MissaleUITests
