name: Missale
options:
  bundleIdPrefix: com.missale
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Missale:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "WidgetExtension/**"
    dependencies:
      - target: MissaleWidgetsExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Missale
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-MediumItalic.ttf
          - EBGaramond-SemiBold.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
    entitlements:
      path: App/Missale.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.missale.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missale.app

  # Exists so language switching and the Settings preferences can actually be
  # exercised: the Simulator can't be driven from a shell, and every fix in
  # those screens was going out verified only by reading the code.
  MissaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Missale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missale.app.UITests
        TEST_TARGET_NAME: Missale
        GENERATE_INFOPLIST_FILE: "YES"

  MissaleWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WidgetExtension
      - path: Sources/DesignSystem/Colors.swift
      - path: Sources/DesignSystem/Typography.swift
      # Shared with the app so the widget draws today's word from the same
      # catalog instead of a second copy that drifts — see WidgetContent.swift.
      - path: Sources/DesignSystem/AppLanguage.swift
      - path: Sources/Models/LocalizedCatalog.swift
      - path: Sources/Models/WordOfDay.swift
      - path: Sources/MockData/MockWordOfDay.swift
      # O pool importado vive num arquivo gerado; sem ele o widget
      # mostraria um pool menor que o do app.
      - path: Sources/MockData/Generated/GeneratedWordOfDay.swift
      - path: Sources/Fonts
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Missale Widgets
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-MediumItalic.ttf
          - EBGaramond-SemiBold.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missale.app.MissaleWidgets
        PRODUCT_NAME: MissaleWidgets

schemes:
  Missale:
    build:
      targets:
        Missale: all
        MissaleWidgetsExtension: all
        MissaleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MissaleUITests
