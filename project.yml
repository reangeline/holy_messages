name: HolyMessages
options:
  bundleIdPrefix: com.holymessages
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  HolyMessages:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Holy Messages
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIImageName: SplashImage
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/HolyMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.holymessages.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app
    dependencies:
      - target: HolyMessagesWidgetExtension
        embed: true

  HolyMessagesWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Holy Messages
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HolyMessagesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.holymessages.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holymessages.app.HolyMessagesWidget
        SKIP_INSTALL: true
