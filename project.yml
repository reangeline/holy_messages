name: Missale
options:
  bundleIdPrefix: com.missale
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Missale:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Missale
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-MediumItalic.ttf
          - EBGaramond-SemiBold.ttf
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
    entitlements:
      path: App/Missale.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.missale.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missale.app
